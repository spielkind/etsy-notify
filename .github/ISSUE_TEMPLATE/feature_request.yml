name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/spielkind/shop-notify/issues?q=is%3Aopen+label%3Aroadmap)
        first – maybe it is already planned.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the use case rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Possible solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you considered
