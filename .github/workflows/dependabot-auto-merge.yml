name: Dependabot auto-merge

# Patch and minor updates from Dependabot are merged automatically once all required
# checks have passed (enforced by the branch ruleset). Major updates stay manual.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'spielkind/shop-notify'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request
      pull-requests: write # enable auto-merge
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
