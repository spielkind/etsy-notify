name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly: rebuild main (base image updates, auto-merged dependencies), scan the
  # released image and clean up old images
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      cleanup-dry-run:
        description: Only log which images the cleanup would delete
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name != 'pull_request' }}
  # Scheduled/manual runs report vulnerabilities in code scanning instead of failing
  SCHEDULED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push the per-platform image by digest
      security-events: write # upload vulnerability scan results
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: shop-notify:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python shop-notify:ci -c "import shop_notify.__main__"
          docker run --rm shop-notify:ci --help
          test "$(docker run --rm --entrypoint id shop-notify:ci -u)" = "1000"
          out=$(docker run --rm -e ETSY_API_KEY=k -e ETSY_SHARED_SECRET=s -e ETSY_SHOP_ID=1 \
            shop-notify:ci healthcheck || true)
          grep -q "no heartbeat yet" <<<"$out"
          tz=$(docker run --rm -e TZ=Europe/Berlin --entrypoint python shop-notify:ci \
            -c "import time; print(time.strftime('%Z'))")
          [[ "$tz" == CET || "$tz" == CEST ]] || { echo "TZ not applied: $tz"; exit 1; }

      # Fixable critical/high vulnerabilities in OS packages and Python libraries fail
      # the build – except for scheduled runs, which only report them
      - name: Vulnerability scan
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shop-notify:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: ${{ env.SCHEDULED == 'true' && '0' || '1' }}
      - name: Upload scan results to GitHub code scanning
        if: always() && matrix.platform == 'linux/amd64' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Scan summary
        if: always() && matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shop-notify:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - name: Write scan summary
        if: always() && matrix.platform == 'linux/amd64'
        run: scripts/trivy-summary.sh "image built from this commit" trivy.json

      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push by digest
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        shell: bash
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
    env:
      PLATFORM: ${{ matrix.platform }}

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # create the multi-arch manifest and push the attestation
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # "latest" = newest release (including release candidates), "main" = development state
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "${tags[0]}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=${tags[0]}" >> "$GITHUB_OUTPUT"

      - name: Inspect
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: docker buildx imagetools inspect "$TAG"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # Weekly: scan the released image that is actually deployed (no rebuild)
  scan-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload vulnerability scan results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vulnerability scan of ${{ env.IMAGE }}:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-latest.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-latest.sarif
          category: trivy-latest
      - name: Scan summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-latest.json
          exit-code: "0"
      - name: Write scan summary
        run: scripts/trivy-summary.sh "released image (latest)" trivy-latest.json

  # Weekly: delete old commit images; releases, latest and main are always kept.
  # Runs only after a successful build so that freshly pushed, still untagged
  # platform images are never touched (additionally protected by older-than).
  cleanup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [merge, scan-latest]
    runs-on: ubuntu-latest
    permissions:
      packages: write # delete package versions
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          package: shop-notify
          delete-tags: sha-*
          keep-n-tagged: 10
          exclude-tags: latest,main,*.*
          delete-untagged: true
          delete-orphaned-images: true
          older-than: 1 day
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup-dry-run }}
