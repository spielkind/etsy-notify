name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points to a commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check tag against package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version=$(uv version --short)
          uv run --no-project --with packaging python - "$TAG" "$package_version" <<'EOF'
          import sys
          from packaging.version import Version
          tag, package = sys.argv[1], sys.argv[2]
          if Version(tag.removeprefix("v")) != Version(package):
              sys.exit(f"Tag {tag} does not match package version {package}")
          print(f"Tag {tag} matches package version {package}")
          EOF

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No section '## [$version]' in CHANGELOG.md"
            exit 1
          fi

      - name: Build distributions and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv build --out-dir dist
          uv export --frozen --no-dev --format cyclonedx1.5 \
            --output-file "dist/shop-notify-${TAG#v}.cdx.json"
          ls -l dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # Attach the signed provenance bundle to the release, so it can be verified
      # offline (and is recognised by OpenSSF Scorecard's Signed-Releases check)
      - name: Add provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE" "dist/shop-notify-${TAG#v}.sigstore.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          # Releases are immutable once published: create a draft with all files
          # attached first, then publish it
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
