name: Links

# Checks the links in the documentation: weekly (external pages move) and for
# pull requests that change documentation. Not a required check, as external
# sites can be temporarily unavailable.

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths: ["**.md", "lychee.toml", ".github/workflows/links.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
