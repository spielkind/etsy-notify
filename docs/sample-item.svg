  <g fill="#FFF8F1" opacity="0.8">
    <circle cx="215" cy="255" r="7"/><circle cx="255" cy="270" r="7"/><circle cx="295" cy="255" r="7"/>
    <circle cx="335" cy="270" r="7"/><circle cx="370" cy="255" r="7"/>
  </g>
  <!-- sample label -->
  <g transform="translate(20 20)">
    <rect width="132" height="34" rx="17" fill="#2A9D8F"/>
    <text x="66" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">SAMPLE</text>
  </g>
