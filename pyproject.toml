[project]
name = "shop-notify"
version = "1.0.0rc2"
description = "Watch an Etsy shop for new listings and send notifications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "apprise>=2.0.1",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.scripts]
shop-notify = "shop_notify.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.7.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["shop_notify"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":', "assert_never\\("]
