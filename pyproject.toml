[project]
name = "shop-notify"
version = "1.0.2"
description = "Watch an Etsy shop for new listings and send notifications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Reik Keutterling", email = "spielkind@gmail.com" }]
keywords = ["etsy", "notifications", "apprise", "shop", "new-listings", "telegram", "ntfy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications",
    "Topic :: Office/Business",
]
dependencies = [
    "apprise>=2.0.1",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.urls]
Homepage = "https://github.com/spielkind/shop-notify"
Documentation = "https://github.com/spielkind/shop-notify#readme"
Changelog = "https://github.com/spielkind/shop-notify/blob/main/CHANGELOG.md"
Issues = "https://github.com/spielkind/shop-notify/issues"
Source = "https://github.com/spielkind/shop-notify"

[project.scripts]
shop-notify = "shop_notify.__main__:main"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "hypothesis>=6.170.5",
    "mypy>=1.18",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "respx>=0.22",
    "ruff>=0.14",
    "twine>=7.0.0",
    "typos>=1.51.1",
    "zizmor>=1.31.1",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["shop_notify"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":', "assert_never\\("]
